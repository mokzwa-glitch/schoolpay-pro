{% extends "base.html" %}

{% block title %}Modifier un motif{% endblock %}

{% block content %}

<div class="container-fluid">

    <div class="row justify-content-center">

        <div class="col-lg-6">

            <div class="card shadow">

                <div class="card-header bg-warning text-dark">

                    <h4>

                        <i class="bi bi-pencil-square"></i>

                        Modifier un motif de paiement

                    </h4>

                </div>

                <div class="card-body">

                    <form method="POST">

                        <div class="mb-3">

                            <label class="form-label">

                                Nom du motif

                            </label>

                            <input
                                type="text"
                                name="nom"
                                class="form-control"
                                value="{{ motif.nom }}"
                                required>

                        </div>

                        <div class="d-flex justify-content-between">

                            <a
                                href="{{ url_for('motifs') }}"
                                class="btn btn-secondary">

                                <i class="bi bi-arrow-left"></i>

                                Retour

                            </a>

                            <button
                                type="submit"
                                class="btn btn-success">

                                <i class="bi bi-check-circle"></i>

                                Enregistrer

                            </button>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
