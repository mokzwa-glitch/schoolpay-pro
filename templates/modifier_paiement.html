{% extends "base.html" %}

{% block title %}Modifier un paiement{% endblock %}

{% block content %}

<div class="container-fluid">

    <div class="row justify-content-center">

        <div class="col-lg-8">

            <div class="card shadow">

                <div class="card-header bg-warning text-dark">

                    <h4>

                        <i class="bi bi-pencil-square"></i>

                        Modifier un paiement

                    </h4>

                </div>

                <div class="card-body">

                    <form method="POST">

                        <div class="mb-3">

                            <label>Élève</label>

                            <select
                                name="eleve_id"
                                class="form-select"
                                required>

                                {% for e in eleves %}

                                <option
                                    value="{{ e.id }}"
                                    {% if paiement.eleve_id == e.id %}selected{% endif %}>

                                    {{ e.matricule }} - {{ e.nom }} {{ e.postnom }} {{ e.prenom }}

                                </option>

                                {% endfor %}

                            </select>

                        </div>

                        <div class="mb-3">

                            <label>Motif</label>

                            <select
                                name="motif_id"
                                class="form-select"
                                required>

                                {% for m in motifs %}

                                <option
                                    value="{{ m.id }}"
                                    {% if paiement.motif_id == m.id %}selected{% endif %}>

                                    {{ m.nom }}

                                </option>

                                {% endfor %}

                            </select>

                        </div>

                        <div class="mb-3">

                            <label>Montant</label>

                            <input
                                type="number"
                                step="0.01"
                                name="montant"
                                class="form-control"
                                value="{{ paiement.montant }}"
                                required>

                        </div>

                        <div class="mb-3">

                            <label>Devise</label>

                            <select
                                name="devise"
                                class="form-select">

                                <option
                                    value="USD"
                                    {% if paiement.devise=="USD" %}selected{% endif %}>

                                    USD

                                </option>

                                <option
                                    value="CDF"
                                    {% if paiement.devise=="CDF" %}selected{% endif %}>

                                    CDF

                                </option>

                            </select>

                        </div>

                        <div class="mb-3">

                            <label>Mode de paiement</label>

                            <select
                                name="mode_paiement"
                                class="form-select">

                                <option
                                    value="Espèces"
                                    {% if paiement.mode_paiement=="Espèces" %}selected{% endif %}>

                                    Espèces

                                </option>

                                <option
                                    value="Mobile Money"
                                    {% if paiement.mode_paiement=="Mobile Money" %}selected{% endif %}>

                                    Mobile Money

                                </option>

                                <option
                                    value="Banque"
                                    {% if paiement.mode_paiement=="Banque" %}selected{% endif %}>

                                    Banque

                                </option>

                            </select>

                        </div>

                        <div class="mb-3">

                            <label>Référence</label>

                            <input
                                type="text"
                                name="reference"
                                class="form-control"
                                value="{{ paiement.reference or '' }}">

                        </div>

                        <div class="mb-3">

                            <label>Observation</label>

                            <textarea
                                name="observation"
                                class="form-control"
                                rows="3">{{ paiement.observation or '' }}</textarea>

                        </div>

                        <div class="d-flex justify-content-between">

                            <a
                                href="{{ url_for('paiements') }}"
                                class="btn btn-secondary">

                                <i class="bi bi-arrow-left"></i>

                                Retour

                            </a>

                            <button
                                type="submit"
                                class="btn btn-success">

                                <i class="bi bi-save"></i>

                                Enregistrer

                            </button>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
