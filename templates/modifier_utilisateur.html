{% extends "base.html" %}

{% block title %}

Modifier un utilisateur

{% endblock %}

{% block content %}

<div class="container-fluid">

<div class="row justify-content-center">

<div class="col-lg-8">

<div class="card shadow">

<div class="card-header bg-warning text-dark">

<h4>

<i class="bi bi-pencil-square"></i>

Modifier un utilisateur

</h4>

</div>

<div class="card-body">

<form method="POST">

<div class="row">

<div class="col-md-4 mb-3">

<label>Nom</label>

<input
type="text"
name="nom"
class="form-control"
value="{{ utilisateur.nom }}"
required>

</div>

<div class="col-md-4 mb-3">

<label>Postnom</label>

<input
type="text"
name="postnom"
class="form-control"
value="{{ utilisateur.postnom }}">

</div>

<div class="col-md-4 mb-3">

<label>Prénom</label>

<input
type="text"
name="prenom"
class="form-control"
value="{{ utilisateur.prenom }}">

</div>

<div class="col-md-6 mb-3">

<label>Nom d'utilisateur</label>

<input
type="text"
name="username"
class="form-control"
value="{{ utilisateur.username }}"
required>

</div>

<div class="col-md-6 mb-3">

<label>Nouveau mot de passe</label>

<input
type="password"
name="password"
class="form-control"
placeholder="Laisser vide pour conserver">

</div>

<div class="col-md-6 mb-3">

<label>Téléphone</label>

<input
type="text"
name="telephone"
class="form-control"
value="{{ utilisateur.telephone or '' }}">

</div>

<div class="col-md-6 mb-3">

<label>Email</label>

<input
type="email"
name="email"
class="form-control"
value="{{ utilisateur.email or '' }}">

</div>

<div class="col-md-6 mb-3">

<label>Rôle</label>

<select
name="role_id"
class="form-select"
required>

{% for role in roles %}

<option
value="{{ role.id }}"
{% if utilisateur.role_id == role.id %}selected{% endif %}>

{{ role.nom }}

</option>

{% endfor %}

</select>

</div>

</div>

<div class="d-flex justify-content-between">

<a
href="{{ url_for('utilisateurs') }}"
class="btn btn-secondary">

<i class="bi bi-arrow-left"></i>

Retour

</a>

<button
type="submit"
class="btn btn-success">

<i class="bi bi-save"></i>

Enregistrer

</button>

</div>

</form>

</div>

</div>

</div>

</div>

</div>

{% endblock %}
