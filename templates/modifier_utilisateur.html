{% extends "base.html" %}

{% block title %}Modifier un utilisateur{% endblock %}

{% block content %}

<div class="container-fluid">

    <div class="row justify-content-center">

        <div class="col-lg-7">

            <div class="card shadow">

                <div class="card-header bg-warning text-dark">

                    <h4 class="mb-0">

                        <i class="bi bi-pencil-square"></i>

                        Modifier un utilisateur

                    </h4>

                </div>

                <div class="card-body">

                    <form method="POST">

                        <div class="mb-3">

                            <label class="form-label">

                                Nom d'utilisateur

                            </label>

                            <input
                                type="text"
                                name="username"
                                class="form-control"
                                value="{{ utilisateur.username }}"
                                required>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">

                                Rôle

                            </label>

                            <select
                                name="role"
                                class="form-select"
                                required>

                                <option value="Administrateur"
                                {% if utilisateur.role=="Administrateur" %}selected{% endif %}>
                                    Administrateur
                                </option>

                                <option value="Comptable"
                                {% if utilisateur.role=="Comptable" %}selected{% endif %}>
                                    Comptable
                                </option>

                                <option value="Secretaire"
                                {% if utilisateur.role=="Secretaire" %}selected{% endif %}>
                                    Secrétaire
                                </option>

                                <option value="Directeur"
                                {% if utilisateur.role=="Directeur" %}selected{% endif %}>
                                    Directeur
                                </option>

                            </select>

                        </div>

                        <div class="mb-4">

                            <label class="form-label">

                                Nouveau mot de passe
                                <small class="text-muted">
                                    (laisser vide pour conserver l'ancien)
                                </small>

                            </label>

                            <input
                                type="password"
                                name="password"
                                class="form-control"
                                placeholder="********">

                        </div>

                        <div class="d-flex justify-content-between">

                            <a
                                href="{{ url_for('utilisateurs') }}"
                                class="btn btn-secondary">

                                <i class="bi bi-arrow-left"></i>

                                Retour

                            </a>

                            <button
                                type="submit"
                                class="btn btn-success">

                                <i class="bi bi-save"></i>

                                Enregistrer les modifications

                            </button>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
