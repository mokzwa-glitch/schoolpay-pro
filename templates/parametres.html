{% extends "base.html" %}

{% block title %}Paramètres{% endblock %}

{% block content %}

<div class="container-fluid">

    <div class="row justify-content-center">

        <div class="col-lg-8">

            <div class="card shadow">

                <div class="card-header bg-primary text-white">

                    <h4 class="mb-0">
                        <i class="bi bi-gear-fill"></i>
                        Paramètres de l'établissement
                    </h4>

                </div>

                <div class="card-body">

                    <form method="POST">

                        <div class="mb-3">

                            <label class="form-label">

                                Nom de l'établissement

                            </label>

                            <input
                                type="text"
                                name="nom_ecole"
                                class="form-control"
                                value="{{ parametre.nom_ecole if parametre else '' }}"
                                required>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">

                                Adresse

                            </label>

                            <input
                                type="text"
                                name="adresse"
                                class="form-control"
                                value="{{ parametre.adresse if parametre else '' }}">

                        </div>

                        <div class="mb-3">

                            <label class="form-label">

                                Téléphone

                            </label>

                            <input
                                type="text"
                                name="telephone"
                                class="form-control"
                                value="{{ parametre.telephone if parametre else '' }}">

                        </div>

                        <div class="mb-3">

                            <label class="form-label">

                                Adresse e-mail

                            </label>

                            <input
                                type="email"
                                name="email"
                                class="form-control"
                                value="{{ parametre.email if parametre else '' }}">

                        </div>

                        <div class="mb-4">

                            <label class="form-label">

                                Devise utilisée

                            </label>

                            <select
                                name="devise"
                                class="form-select">

                                <option value="USD"
                                {% if parametre and parametre.devise=="USD" %}selected{% endif %}>
                                    Dollar américain (USD)
                                </option>

                                <option value="CDF"
                                {% if parametre and parametre.devise=="CDF" %}selected{% endif %}>
                                    Franc congolais (CDF)
                                </option>

                            </select>

                        </div>

                        <div class="d-flex justify-content-between">

                            <a
                                href="{{ url_for('dashboard') }}"
                                class="btn btn-secondary">

                                <i class="bi bi-arrow-left"></i>

                                Retour

                            </a>

                            <button
                                type="submit"
                                class="btn btn-success">

                                <i class="bi bi-save"></i>

                                Enregistrer

                            </button>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
